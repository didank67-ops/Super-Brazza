<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Brazza</title>
<meta name="theme-color" content="#0b5a34">
<link rel="icon" type="image/png" href="logo-rond.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --vert: #0f9d58; --jaune: #ffc928; --rouge: #d62828;
    --carte: rgba(255,255,255,.08); --bord: rgba(255,255,255,.16); --texte: #ffffff; --doux: #b7cfc2;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; color: var(--texte);
    background: linear-gradient(180deg, #0d6b3b 0%, #08391f 45%, #041d10 100%) fixed;
    min-height: 100vh; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }
  .bande {
    height: 8px; background: repeating-linear-gradient(90deg, #0f9d58 0 36px, #ffc928 36px 72px, #d62828 72px 108px);
    margin-top: env(safe-area-inset-top, 0px);
  }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 12px 6px; max-width: 560px; margin: 0 auto; }
  .point { width: 14px; height: 14px; border-radius: 50%; background: var(--jaune); flex: none; }
  header h1 { font-size: 1.25rem; margin: 0; letter-spacing: .3px; white-space: nowrap; }
  .crayon { border: 0; background: transparent; font-size: 1.35rem; cursor: pointer; padding: 4px 8px; flex: 1; text-align: left; }
  .pts {
    border: 2px solid var(--bord); background: var(--carte); color: var(--texte); border-radius: 999px;
    font-weight: 700; padding: 8px 14px; white-space: nowrap; font-size: .98rem;
  }
  .pts b { color: var(--jaune); }
  main { max-width: 560px; margin: 0 auto; padding: 8px 16px 16px; }
  [hidden] { display: none !important; }
  .vue[hidden] { display: none; }

  /* Accueil */
  .salut {
    position: relative; background: #fff; color: #17301f; border-radius: 22px; padding: 14px 18px; margin: 8px 8px 16px;
    font-size: 1.08rem; line-height: 1.45;
  }
  .salut::after {
    content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -10px;
    border: 10px solid transparent; border-bottom: 0; border-top-color: #fff;
  }
  .cadre-video { display: flex; justify-content: center; }
  .boite-video { position: relative; height: min(66vh, 560px); aspect-ratio: 9 / 16; max-width: 100%; }
  .boite-video video {
    width: 100%; height: 100%; object-fit: cover; background: #000;
    border-radius: 22px; border: 4px solid var(--jaune); display: block;
  }
  .lecture {
    position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,201,40,.95); color: #20300f; font-size: 2.2rem; box-shadow: 0 6px 20px rgba(0,0,0,.4);
  }
  .lecture[hidden] { display: none; }
  .btn-ecouter {
    display: block; margin: 16px auto; border: 0; border-radius: 999px; cursor: pointer; min-width: 78%;
    background: linear-gradient(180deg, #ffd24a, #f5b800); color: #20300f; font: inherit; font-weight: 800;
    font-size: 1.18rem; padding: 16px 22px; box-shadow: 0 8px 22px rgba(255,201,40,.35);
  }
  .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
  .tuile {
    grid-column: 1 / -1; text-align: left; font: inherit; color: var(--texte); background: var(--carte);
    border: 2px solid var(--bord); border-radius: 28px; padding: 22px 20px; cursor: pointer; min-height: 130px;
  }
  .tuile.demi { grid-column: auto; padding: 20px 16px; }
  .tuile.live { border-color: var(--jaune); }
  .tuile .emoji { font-size: 2.1rem; display: block; margin-bottom: 14px; }
  .tuile b { display: block; font-size: 1.2rem; margin-bottom: 8px; }
  .tuile small { display: block; font-size: 1rem; color: var(--doux); line-height: 1.35; }
  .carte-maillots { background: var(--carte); border: 2px solid var(--bord); border-radius: 28px; padding: 18px; margin-top: 14px; }
  .carte-maillots .tete { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .carte-maillots .tete b { font-size: 1.2rem; }
  .carte-maillots .tete span { color: var(--doux); font-weight: 700; }
  .maillots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .maillot { position: relative; aspect-ratio: 1; border-radius: 18px; background: #0a2a1a; border: 3px solid transparent; overflow: hidden; padding: 0; cursor: pointer; font: inherit; color: var(--texte); }
  .maillot.actif { border-color: var(--jaune); }
  .maillot img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .maillot.verrou img { filter: grayscale(1) brightness(.4); }
  .maillot .nom { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; font-size: .8rem; font-weight: 800; text-shadow: 0 1px 3px #000; }
  .maillot .cadenas { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.65); border-radius: 999px; min-width: 30px; height: 30px; padding: 0 7px; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 800; gap: 3px; }
  .prochain { margin: 12px 0 0; color: var(--doux); font-size: .98rem; text-align: center; }

  /* Chat */
  .scene { display: flex; align-items: flex-end; gap: 12px; margin: 6px 0 10px; }
  .scene img { width: 96px; flex: none; }
  .scene img.parle { animation: saut .5s ease-in-out infinite alternate; }
  @keyframes saut { from { transform: translateY(0); } to { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .scene img.parle { animation: none; } }
  .bulle {
    background: #fff; color: #17301f; border-radius: 22px 22px 22px 4px; padding: 12px 14px;
    font-size: 1.05rem; line-height: 1.45; min-height: 64px; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .bulle.limite { box-shadow: 0 0 0 3px var(--rouge); }
  .compteur { font-weight: 700; margin: 8px 0 12px; }
  .compteur span { color: var(--jaune); }
  label.info { color: var(--doux); font-size: .95rem; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical; font: inherit; font-size: 1.05rem; color: #17301f;
    padding: 12px; border: 3px solid var(--jaune); border-radius: 16px; background: #fff;
  }
  .actions { display: flex; gap: 10px; margin-top: 10px; }
  .actions button { font: inherit; font-weight: 800; font-size: 1.05rem; border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer; min-height: 54px; }
  #envoyer { flex: 1; background: var(--vert); color: #fff; }
  #micro { background: var(--jaune); color: #20300f; }
  #micro.ecoute { background: var(--rouge); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .cahier { margin-top: 14px; background: rgba(15,157,88,.25); border: 2px solid var(--vert); border-radius: 14px; padding: 10px 12px; }
  .cahier[hidden] { display: none; }

  /* Bientôt */
  .bientot { text-align: center; padding: 22px 8px; }
  .bientot img { width: 130px; }
  .bientot h2 { font-size: 1.4rem; margin: 10px 0 6px; }
  .bientot p { color: var(--doux); }
  .retour { border: 2px solid var(--bord); background: var(--carte); color: var(--texte); font: inherit; font-weight: 700; border-radius: 999px; padding: 10px 18px; cursor: pointer; }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; background: #04210f;
    border-top: 2px solid var(--bord); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav button { flex: 1; border: 0; background: transparent; font: inherit; padding: 10px 2px 8px; cursor: pointer; color: var(--doux); }
  nav button .emoji { display: block; font-size: 1.6rem; }
  nav button small { font-weight: 800; font-size: .95rem; }
  nav button[aria-current="page"] { color: var(--jaune); }

  /* Fenêtre "Comment tu t'appelles ?" */
  .voile { position: fixed; inset: 0; z-index: 20; background: rgba(2,14,8,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .voile[hidden] { display: none; }
  .modale { background: #fff; color: #0e2a4a; width: 100%; max-width: 420px; border-radius: 34px; padding: 28px 22px 24px; text-align: center; }
  .modale img { width: 84px; height: 84px; }
  .modale h2 { margin: 10px 0 6px; font-size: 1.55rem; }
  .modale p { margin: 0 0 16px; color: #4d6277; font-size: 1.05rem; line-height: 1.4; }
  .modale input {
    width: 100%; font: inherit; font-size: 1.3rem; font-weight: 700; text-align: center; color: #0e2a4a;
    padding: 16px; border: 3px solid #e1e1e1; border-radius: 999px; background: #fff;
  }
  .modale input:focus { border-color: var(--vert); outline: none; }
  .modale .q { margin: 18px 0 10px; font-weight: 700; color: #35506b; }
  .ages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ages button { font: inherit; font-weight: 800; font-size: 1.1rem; color: #0e2a4a; background: #fff; border: 3px solid #e1e1e1; border-radius: 20px; padding: 16px 0; cursor: pointer; }
  .ages button[aria-pressed="true"] { border-color: var(--vert); background: #e6f6ec; }
  .modale .go { width: 100%; margin-top: 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 800; font-size: 1.2rem; padding: 18px; color: #fff; background: linear-gradient(135deg, #0f9d58, #1fbf73); cursor: pointer; }
  .modale .erreur { color: var(--rouge); font-weight: 700; min-height: 1.3em; margin: 10px 0 0; font-size: .98rem; }
  .modale .lien { margin-top: 8px; background: transparent; border: 0; color: #4d6277; font: inherit; font-weight: 700; cursor: pointer; padding: 8px; }
  .modale .lien[hidden] { display: none; }

  /* Message de félicitation / info */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 15; max-width: 520px; margin: 0 auto; background: var(--jaune); color: #20300f; font-weight: 800; border-radius: 18px; padding: 14px 16px; text-align: center; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
  .toast[hidden] { display: none; }

  /* Voix + quiz */
  .mini { font: inherit; font-weight: 700; border: 2px solid var(--bord); background: var(--carte); color: var(--texte); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .voixbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
  .quiz-carte { background: var(--carte); border: 2px solid var(--bord); border-radius: 28px; padding: 20px; margin-top: 12px; }
  .quiz-prog { color: var(--doux); font-weight: 700; margin-bottom: 8px; }
  .quiz-q { font-size: 1.3rem; font-weight: 800; line-height: 1.35; margin: 4px 0 16px; }
  .reps { display: grid; gap: 12px; }
  .rep { text-align: left; font: inherit; font-weight: 700; font-size: 1.1rem; color: var(--texte); background: rgba(255,255,255,.1); border: 3px solid var(--bord); border-radius: 20px; padding: 16px; cursor: pointer; }
  .rep:disabled { opacity: 1; cursor: default; }
  .rep.bon { background: rgba(15,157,88,.55); border-color: #5be39a; }
  .rep.mauvais { background: rgba(214,40,40,.55); border-color: #ff8a8a; }
  .quiz-fb { margin-top: 14px; background: #fff; color: #17301f; border-radius: 18px; padding: 12px 14px; font-size: 1.05rem; line-height: 1.4; }
  .gros { display: block; width: 100%; margin-top: 14px; border: 0; border-radius: 999px; font: inherit; font-weight: 800; font-size: 1.15rem; padding: 16px; background: var(--jaune); color: #20300f; cursor: pointer; }
  .gros.second { background: var(--carte); color: var(--texte); border: 2px solid var(--bord); }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .cat { text-align: left; font: inherit; font-weight: 700; color: var(--texte); background: rgba(255,255,255,.1); border: 2px solid var(--bord); border-radius: 20px; padding: 14px; cursor: pointer; }
  .cat .emoji { font-size: 1.6rem; display: block; margin-bottom: 6px; }
  .cat small { display: block; color: var(--doux); font-weight: 600; margin-top: 2px; }
  .cat.large { grid-column: 1 / -1; border-color: var(--jaune); }
  .score { font-size: 2.6rem; font-weight: 800; text-align: center; margin: 6px 0; }
  .quiz-carte p { color: var(--doux); font-size: 1.05rem; line-height: 1.4; margin: 8px 0; }
  button:focus-visible { outline: 4px solid #8ab4ff; outline-offset: 2px; }
  textarea:focus-visible, input:focus-visible { outline: 4px solid #8ab4ff; outline-offset: 2px; }
</style>
</head>
<body>
<div class="bande" aria-hidden="true"></div>
<header>
  <span class="point" aria-hidden="true"></span>
  <h1>Super Brazza</h1>
  <button type="button" class="crayon" id="crayon" aria-label="Changer mon prénom et mon âge">✏️</button>
  <span class="pts">★ <b id="pts">0</b> pts</span>
</header>

<main>
  <!-- ACCUEIL -->
  <section class="vue" id="v-accueil">
    <p class="salut" id="salut"></p>
    <div class="cadre-video">
      <div class="boite-video">
        <video id="video" src="video-accueil.mp4" poster="poster.jpg" muted loop autoplay playsinline preload="auto"></video>
        <button type="button" class="lecture" id="lecture" aria-label="Lancer la vidéo" hidden>▶</button>
      </div>
    </div>
    <button type="button" class="btn-ecouter" id="btn-ecouter">🔊 Écouter Super Brazza</button>
    <div class="grille" id="grille"></div>
    <div class="carte-maillots">
      <div class="tete"><b>Mes maillots</b><span>CONGO</span></div>
      <div class="maillots" id="maillots"></div>
      <p class="prochain" id="prochain"></p>
    </div>
  </section>

  <!-- CHAT -->
  <section class="vue" id="v-chat" hidden>
    <div class="scene">
      <img id="mascotte" src="brazza-vert.png" alt="Super Brazza">
      <div class="bulle" id="reponse" aria-live="polite"></div>
    </div>
    <div class="voixbar">
      <button type="button" class="mini" id="voix"></button>
      <button type="button" class="mini" id="reecouter">🔁 Réécouter</button>
    </div>
    <p class="compteur" id="compteur"></p>
    <label for="question" class="info">Ta question</label>
    <textarea id="question" maxlength="300" placeholder="Écris ou dis ta question…"></textarea>
    <div class="actions">
      <button type="button" id="micro">🎤 Parler</button>
      <button type="button" id="envoyer">Demander</button>
    </div>
    <p class="cahier" id="cahier" hidden>✏️ Recopie la réponse dans ton cahier pour bien la comprendre.</p>
  </section>

  <!-- QUIZ -->
  <section class="vue" id="v-quiz" hidden>
    <button type="button" class="retour" id="quiz-retour">← Retour</button>
    <div id="quiz-zone"></div>
  </section>

  <!-- BIENTÔT -->
  <section class="vue" id="v-bientot" hidden>
    <button type="button" class="retour" id="retour">← Retour</button>
    <div class="bientot">
      <img id="img-bientot" src="brazza-vert.png" alt="">
      <h2 id="bientot-titre"></h2>
      <p>Cette rubrique arrive bientôt. Super Brazza la prépare !</p>
    </div>
  </section>
</main>

<nav aria-label="Menu">
  <button type="button" data-nav="accueil" aria-current="page"><span class="emoji">🏠</span><small>Accueil</small></button>
  <button type="button" data-nav="quiz"><span class="emoji">🧠</span><small>Quiz</small></button>
  <button type="button" data-nav="histoire"><span class="emoji">🌙</span><small>Histoires</small></button>
  <button type="button" data-nav="chat"><span class="emoji">💬</span><small>Brazza</small></button>
</nav>

<!-- Fenêtre prénom / âge -->
<div class="voile" id="voile" hidden>
  <div class="modale" role="dialog" aria-modal="true" aria-labelledby="m-titre">
    <img src="logo-rond.png" alt="">
    <h2 id="m-titre">Comment tu t’appelles ?</h2>
    <p>Super Brazza veut connaître ton prénom pour bien t’accueillir !</p>
    <input id="prenom" type="text" maxlength="20" autocomplete="off" placeholder="Ton prénom" aria-label="Ton prénom">
    <p class="q">Quel âge as-tu ?</p>
    <div class="ages" id="ages">
      <button type="button" data-age="4-6" aria-pressed="false">4-6</button>
      <button type="button" data-age="7-9" aria-pressed="false">7-9</button>
      <button type="button" data-age="10-12" aria-pressed="false">10-12</button>
    </div>
    <p class="erreur" id="erreur-profil" aria-live="polite"></p>
    <button type="button" class="go" id="go">C’est parti !</button>
    <button type="button" class="lien" id="fermer" hidden>Fermer</button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script id="donnees-quiz">
/*QUIZ_DATA_START*/
// Banque de questions Super Brazza — Quiz Congo (275 questions). n = niveau (1 facile 4-6 ans, 2 moyen 7-9 ans, 3 difficile 10-12 ans).
var QUIZ_CATEGORIES = [{"id": "symboles", "e": "🇨🇬", "t": "Symboles du Congo"}, {"id": "geo", "e": "🗺️", "t": "Géographie"}, {"id": "nature", "e": "🦍", "t": "Nature et animaux"}, {"id": "histoire", "e": "📜", "t": "Histoire"}, {"id": "monuments", "e": "🏛️", "t": "Monuments et villes"}, {"id": "sites", "e": "🏞️", "t": "Sites à découvrir"}, {"id": "culture", "e": "🎶", "t": "Culture et musique"}, {"id": "langues", "e": "🗣️", "t": "Lingala"}, {"id": "cuisine", "e": "🍲", "t": "Cuisine"}, {"id": "sport", "e": "⚽", "t": "Sport"}, {"id": "economie", "e": "🚂", "t": "Économie et transports"}];
var QUIZ_CONGO = [
  {"id": "symboles-001", "c": "symboles", "n": 1, "q": "Comment s’appelle la capitale du Congo ?", "r": ["Brazzaville", "Pointe-Noire", "Dolisie"], "ok": 0, "info": "Brazzaville est la capitale du Congo."},
  {"id": "symboles-002", "c": "symboles", "n": 1, "q": "Quelles sont les couleurs du drapeau du Congo ?", "r": ["Vert, jaune et rouge", "Bleu, blanc et rouge", "Noir, jaune et vert"], "ok": 0, "info": "Le drapeau du Congo est vert, jaune et rouge."},
  {"id": "symboles-003", "c": "symboles", "n": 1, "q": "Combien de couleurs y a-t-il sur le drapeau du Congo ?", "r": ["Trois", "Deux", "Cinq"], "ok": 0, "info": "Le drapeau du Congo a trois couleurs : vert, jaune et rouge."},
  {"id": "symboles-004", "c": "symboles", "n": 1, "q": "Sur quel continent se trouve le Congo ?", "r": ["En Afrique", "En Europe", "En Asie"], "ok": 0, "info": "Le Congo est un pays d’Afrique centrale."},
  {"id": "symboles-005", "c": "symboles", "n": 1, "q": "Comment s’appellent les habitants du Congo ?", "r": ["Les Congolais", "Les Gabonais", "Les Camerounais"], "ok": 0, "info": "Les habitants du Congo s’appellent les Congolais."},
  {"id": "symboles-006", "c": "symboles", "n": 2, "q": "Comment s’appelle l’hymne national du Congo ?", "r": ["La Congolaise", "La Marseillaise", "Debout Congolais"], "ok": 0, "info": "L’hymne national du Congo s’appelle La Congolaise."},
  {"id": "symboles-007", "c": "symboles", "n": 2, "q": "Quel jour fête-t-on l’indépendance du Congo ?", "r": ["Le 15 août", "Le 1er janvier", "Le 14 juillet"], "ok": 0, "info": "Le Congo fête son indépendance le 15 août."},
  {"id": "symboles-008", "c": "symboles", "n": 2, "q": "Quelle est la langue officielle du Congo ?", "r": ["Le français", "L’anglais", "L’espagnol"], "ok": 0, "info": "La langue officielle du Congo est le français."},
  {"id": "symboles-009", "c": "symboles", "n": 2, "q": "Quelle monnaie utilise-t-on au Congo ?", "r": ["Le franc CFA", "L’euro", "Le dollar"], "ok": 0, "info": "Au Congo, on utilise le franc CFA."},
  {"id": "symboles-010", "c": "symboles", "n": 2, "q": "Quelle est la devise du Congo ?", "r": ["Unité, Travail, Progrès", "Liberté, Égalité, Fraternité", "Paix, Amour, Joie"], "ok": 0, "info": "La devise du Congo est Unité, Travail, Progrès."},
  {"id": "symboles-011", "c": "symboles", "n": 3, "q": "Comment sont placées les bandes de couleur sur le drapeau du Congo ?", "r": ["En diagonale", "À l’horizontale", "À la verticale"], "ok": 0, "info": "Les trois couleurs du drapeau du Congo sont en diagonale."},
  {"id": "symboles-012", "c": "symboles", "n": 3, "q": "Quel pays porte presque le même nom que le Congo, de l’autre côté du fleuve ?", "r": ["La République démocratique du Congo", "Le Gabon", "L’Angola"], "ok": 0, "info": "De l’autre côté du fleuve Congo, il y a la République démocratique du Congo."},

<script>

// live = rubrique déjà disponible ; size "demi" = deux par ligne

];

// Quiz : 5 questions par partie, 1 point par bonne réponse, plafond de points par jour
const QUIZ_PAR_PARTIE = 5, QUIZ_POINTS_MAX_JOUR = 3;
// Les questions sont intégrées plus haut dans la page (QUIZ_CONGO et QUIZ_CATEGORIES)
const QUIZ = (typeof QUIZ_CONGO !== "undefined") ? QUIZ_CONGO : [];
const QUIZ_CATS = (typeof QUIZ_CATEGORIES !== "undefined") ? QUIZ_CATEGORIES : [];

const TXT = {
  accueilChat: "Salut ! Je suis Super Brazza. Écris ta question dans ton cahier, puis pose-la-moi ici !",
  reflexion: "Je réfléchis…", vide: "Écris d’abord ta question.",

  erreur: "Super Brazza est fatigué en ce moment. Réessaie dans un instant !",
  limite: "Merci ! 🦸 Tu as utilisé tes 2 questions d’aujourd’hui. Recopie bien tes réponses dans ton cahier, apprends-les par cœur, et reviens demain !",
  pasMicro: "Le micro ne marche pas sur ce téléphone. Écris ta question.",
  microErreur: "Je n’ai pas bien entendu. Réessaie ou écris ta question."
};

const $ = id => document.getElementById(id);
const zoneRep = $("reponse"), champ = $("question"), btnEnv = $("envoyer"),
      btnMic = $("micro"), mascotte = $("mascotte"), video = $("video");

let restantes = LIMITE, bloque = false, vue = "accueil", rubCourante = "";
let rec = null, enEcoute = false, points = 0, maillotActif = "vert", profil = null, ageChoisi = "";
let dernierTexte = "", voixActive = true, jetonVoix = 0, parle = false;
let quizPartie = [], quizIdx = 0, quizBonnes = 0, quizCat = "";

/* ---------- Stockage local (uniquement sur le téléphone) ---------- */
function lire(c) { try { return localStorage.getItem(c); } catch (e) { return null; } }
function ecrire(c, v) { try { localStorage.setItem(c, v); } catch (e) {} }
function jour() { return new Date(Date.now() + 3600000).toISOString().slice(0, 10); }
function idAppareil() {
  let id = lire("sb_id");
  if (!id) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
       : "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
    ecrire("sb_id", id);
  }
  return id;
}

/* ---------- Message d'info ---------- */
let minuteur = null;
function toast(msg, duree = 3500) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(minuteur); minuteur = setTimeout(() => { t.hidden = true; }, duree);
}

/* ---------- Profil (prénom + âge) ---------- */
function afficherSalut() {
  const nom = profil && profil.prenom ? " " + profil.prenom : "";
  $("salut").textContent = `Salut${nom} ! Content de te voir 🇨🇬 Appuie sur « Écouter » pour qu’on discute !`;
}
function ouvrirProfil(obligatoire) {
  $("prenom").value = profil ? profil.prenom : "";
  ageChoisi = profil ? profil.age : "";
  majAges();
  $("erreur-profil").textContent = "";
  $("fermer").hidden = !!obligatoire;
  $("voile").hidden = false;
  setTimeout(() => $("prenom").focus(), 50);
}
function fermerProfil() { $("voile").hidden = true; }
function majAges() {
  document.querySelectorAll("#ages button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.age === ageChoisi)));
}
function validerProfil() {
  const prenom = $("prenom").value.trim().slice(0, 20);
  if (!prenom) { $("erreur-profil").textContent = "Écris ton prénom."; return; }
  if (!ageChoisi) { $("erreur-profil").textContent = "Choisis ton âge."; return; }
  profil = { prenom, age: ageChoisi };
  ecrire("sb_profil", JSON.stringify(profil));
  fermerProfil(); afficherSalut();
  toast(`Bienvenue ${prenom} ! 🎉`);
}

/* ---------- Points et maillots ---------- */
function maillotDebloque(m) { return points >= m.seuil; }
function afficherPoints() { $("pts").textContent = String(points); }
function afficherMaillots() {
  const zone = $("maillots"); zone.innerHTML = "";
  MAILLOTS.forEach(m => {
    const ouvert = maillotDebloque(m);
    const b = document.createElement("button");
    b.type = "button";
    b.className = "maillot" + (m.id === maillotActif && ouvert ? " actif" : "") + (ouvert ? "" : " verrou");
    const img = document.createElement("img"); img.src = m.img; img.alt = "";
    const nom = document.createElement("span"); nom.className = "nom"; nom.textContent = m.nom;
    b.append(img, nom);
    if (!ouvert) {
      const c = document.createElement("span"); c.className = "cadenas"; c.textContent = "🔒 " + m.seuil;
      b.append(c);
    }
    b.addEventListener("click", () => {
      if (!maillotDebloque(m)) { toast(`Encore ${m.seuil - points} point(s) pour débloquer le maillot ${m.nom} !`); return; }
      maillotActif = m.id; ecrire("sb_maillot", m.id); appliquerMaillot(); afficherMaillots();
    });
    zone.append(b);
  });
  const suivant = MAILLOTS.find(m => !maillotDebloque(m));
  $("prochain").textContent = suivant
    ? `Encore ${suivant.seuil - points} point(s) pour le maillot ${suivant.nom}`
    : "Bravo ! Tous les maillots sont débloqués 🎉";
}
function appliquerMaillot() {
  const m = MAILLOTS.find(x => x.id === maillotActif) || MAILLOTS[0];
  mascotte.src = m.img; $("img-bientot").src = m.img;
}
function gagnerPoints(n) {
  const avant = points;
  points += n; ecrire("sb_pts", String(points));
  afficherPoints(); afficherMaillots();
  const nouveau = MAILLOTS.find(m => m.seuil > avant && m.seuil <= points);
  if (nouveau) toast(`🎉 Tu as débloqué le maillot ${nouveau.nom} !`, 5000);
  else if (n > 0) toast(`+${n} point${n > 1 ? "s" : ""} ⭐`, 2000);
}

/* ---------- Navigation ---------- */
function aller(nom, rubrique) {
  vue = nom;
  if (rubrique) rubCourante = rubrique;
  const actif = nom === "bientot" ? rubCourante : nom;
  arreterParole();
  const vueId = nom === "chat" ? "v-chat" : nom === "accueil" ? "v-accueil" : nom === "quiz" ? "v-quiz" : "v-bientot";
  ["v-accueil", "v-chat", "v-quiz", "v-bientot"].forEach(v => { $(v).hidden = (v !== vueId); });
  if (nom === "quiz") quizAccueil();
  if (vueId === "v-bientot") {
    const r = RUBRIQUES.find(x => x.id === rubCourante);
    $("bientot-titre").textContent = r ? r.e + " " + r.t : "";
  }
  document.querySelectorAll("nav button").forEach(b => {
    if (b.dataset.nav === actif) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  if (nom === "accueil") jouerVideo(); else video.pause();
  window.scrollTo(0, 0);
}

function construireGrille() {
  const g = $("grille"); g.innerHTML = "";
  RUBRIQUES.forEach(r => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tuile" + (r.size === "demi" ? " demi" : "") + (r.live ? " live" : "");
    const e = document.createElement("span"); e.className = "emoji"; e.textContent = r.e;
    const t = document.createElement("b"); t.textContent = r.t;
    const s = document.createElement("small"); s.textContent = r.d;
    b.append(e, t, s);
    b.addEventListener("click", () => aller(r.live ? r.id : "bientot", r.id));
    g.append(b);
  });
}

/* ---------- Vidéo ---------- */
function jouerVideo() {
  const p = video.play();
  if (p && p.then) p.then(() => { $("lecture").hidden = true; }).catch(() => { $("lecture").hidden = false; });
}
$("lecture").addEventListener("click", () => { jouerVideo(); });
video.addEventListener("error", () => { $("lecture").hidden = true; });
video.addEventListener("playing", () => { $("lecture").hidden = true; });
function majBoutonEcouter() { $("btn-ecouter").textContent = parle ? "⏹ Arrêter" : "🔊 Écouter Super Brazza"; }
$("btn-ecouter").addEventListener("click", () => {
  if (parle) { arreterParole(); return; }
  const nom = profil && profil.prenom ? " " + profil.prenom : "";
  parler(`Salut${nom} ! Je suis Super Brazza. Prêt à jouer avec moi ? Choisis une rubrique, ou pose-moi une question !`);
});

/* ---------- Voix de Super Brazza (synthèse vocale du téléphone) ---------- */
const synth = ("speechSynthesis" in window) ? window.speechSynthesis : null;
let voixFr = null;
function chargerVoix() {
  if (!synth) return;
  const vs = synth.getVoices();
  voixFr = vs.find(v => /^fr[-_]?FR/i.test(v.lang)) || vs.find(v => /^fr/i.test(v.lang)) || null;
}
if (synth) {
  chargerVoix();
  if (synth.addEventListener) synth.addEventListener("voiceschanged", chargerVoix);
  else synth.onvoiceschanged = chargerVoix;
}
function nettoyerPourVoix(t) {
  let r = String(t);
  try { r = r.replace(/\p{Extended_Pictographic}/gu, " "); } catch (e) {}
  return r.replace(/[«»*_#]/g, " ").replace(/\s+/g, " ").trim();
}
function decouper(t) {
  const phrases = t.match(/[^.!?…:\n]+[.!?…:]?/g) || [t];
  const out = []; let cur = "";
  phrases.forEach(p => {
    if ((cur + p).length > 170 && cur) { out.push(cur.trim()); cur = p; } else cur += p;
  });
  if (cur.trim()) out.push(cur.trim());
  return out;
}
function majEtatVoix() {
  majBoutonEcouter();
  mascotte.classList.toggle("parle", parle);
  const v = $("voix");
  if (v) v.textContent = voixActive ? "🔊 Voix : oui" : "🔇 Voix : non";
}
function parler(texte, quandFini) {
  if (!synth) { toast("Ton téléphone ne sait pas lire à voix haute."); return; }
  arreterParole();
  const morceaux = decouper(nettoyerPourVoix(texte));
  if (!morceaux.length) return;
  const moi = ++jetonVoix;
  parle = true; majEtatVoix();
  morceaux.forEach((m, i) => {
    const u = new SpeechSynthesisUtterance(m);
    u.lang = "fr-FR"; if (voixFr) u.voice = voixFr;
    u.rate = 0.95; u.pitch = 1.05;
    u.onerror = () => { if (moi === jetonVoix) { parle = false; majEtatVoix(); } };
    if (i === morceaux.length - 1) {
      u.onend = () => { if (moi === jetonVoix) { parle = false; majEtatVoix(); if (quandFini) quandFini(); } };
    }
    synth.speak(u);
  });
}
function arreterParole() {
  jetonVoix++;
  if (synth) { try { synth.cancel(); } catch (e) {} }
  if (parle) { parle = false; majEtatVoix(); }
}
function parlerSiActif(texte) { if (voixActive) parler(texte); }
document.addEventListener("visibilitychange", () => { if (document.hidden) arreterParole(); });

/* ---------- Chat ---------- */
function afficherCompteur() {
  const c = $("compteur"); c.textContent = "";
  c.append("Questions restantes aujourd’hui : ");
  const s = document.createElement("span"); s.textContent = String(restantes); c.append(s);
}
function memoriserRestantes(n) { restantes = n; ecrire("sb_reste_" + jour(), String(n)); afficherCompteur(); }
function bloquer() {
  bloque = true;
  btnEnv.disabled = true; btnMic.disabled = true; champ.disabled = true;
  zoneRep.classList.add("limite"); zoneRep.textContent = TXT.limite;
  $("cahier").hidden = true;
}

async function demander() {
  const question = champ.value.trim();
  if (!question) { zoneRep.textContent = TXT.vide; delete zoneRep.dataset.rep; return; }
  btnEnv.disabled = true; btnMic.disabled = true;
  zoneRep.classList.remove("limite");
  zoneRep.textContent = TXT.reflexion;
  mascotte.classList.add("parle");
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, deviceId: idAppareil(), lang: "fr" })
    });
    const data = await res.json();
    if (data.ok) {
      zoneRep.textContent = data.answer; zoneRep.dataset.rep = "1"; dernierTexte = data.answer;
      champ.value = ""; $("cahier").hidden = false;
      memoriserRestantes(data.remaining);
      gagnerPoints(POINTS_PAR_REPONSE);
      parlerSiActif(data.answer);
      if (data.remaining <= 0) { bloque = true; btnEnv.disabled = true; btnMic.disabled = true; champ.disabled = true; }
    } else if (data.limitReached) {
      memoriserRestantes(0); bloquer();
    } else {
      zoneRep.textContent = data.error || TXT.erreur; delete zoneRep.dataset.rep;
      if (typeof data.remaining === "number") memoriserRestantes(data.remaining);
    }
  } catch (e) {
    zoneRep.textContent = TXT.reseau; delete zoneRep.dataset.rep;
  } finally {
    mascotte.classList.remove("parle");
    if (!bloque) { btnEnv.disabled = false; btnMic.disabled = false; }
  }
}


/* ---------- Quiz Congo ---------- */
function melanger(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}
function niveauxPourAge() {
  const age = profil ? profil.age : "7-9";
  return age === "4-6" ? [1] : age === "10-12" ? [2, 3] : [1, 2];
}
function quizPointsAujourdhui() { return parseInt(lire("sb_quizpts_" + jour()) || "0", 10) || 0; }
function prenomOuChampion() { return profil && profil.prenom ? profil.prenom : "champion"; }
function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

function vusQuiz() { try { return JSON.parse(lire("sb_quiz_vus") || "[]"); } catch (e) { return []; } }
function noterVue(id) {
  const v = vusQuiz(); if (v.indexOf(id) === -1) { v.push(id); ecrire("sb_quiz_vus", JSON.stringify(v.slice(-900))); }
}
function poolQuiz(cat) {
  const niv = niveauxPourAge();
  let pool = QUIZ.filter(q => (!cat || q.c === cat) && niv.includes(q.n));
  if (pool.length < QUIZ_PAR_PARTIE) pool = QUIZ.filter(q => !cat || q.c === cat); // pas assez : tous les niveaux
  return pool;
}
function quizAccueil() {
  const z = $("quiz-zone"); z.innerHTML = "";
  const c = el("div", "quiz-carte");
  c.append(el("div", "score", "🧠"));
  c.append(el("div", "quiz-q", "Quiz Congo"));
  if (!QUIZ.length) { c.append(el("p", "", "Les questions ne sont pas encore chargées.")); z.append(c); return; }
  c.append(el("p", "", `${QUIZ_PAR_PARTIE} questions par partie. Chaque bonne réponse te donne 1 point (jusqu’à ${QUIZ_POINTS_MAX_JOUR} points par jour).`));
  c.append(el("p", "", `Points gagnés aujourd’hui avec le quiz : ${quizPointsAujourdhui()} / ${QUIZ_POINTS_MAX_JOUR}`));
  c.append(el("p", "", `Choisis un thème (${QUIZ.length} questions en tout) :`));
  const grille = el("div", "cats");
  const melange = el("button", "cat large"); melange.type = "button";
  melange.append(el("span", "emoji", "🎲"), document.createTextNode("Mélange de tous les thèmes"));
  melange.addEventListener("click", () => lancerQuiz(""));
  grille.append(melange);
  QUIZ_CATS.forEach(k => {
    const b = el("button", "cat"); b.type = "button";
    b.append(el("span", "emoji", k.e), document.createTextNode(k.t));
    b.append(el("small", "", `${poolQuiz(k.id).length} questions`));
    b.addEventListener("click", () => lancerQuiz(k.id));
    grille.append(b);
  });
  c.append(grille); z.append(c);
}
function lancerQuiz(cat) {
  if (cat !== undefined) quizCat = cat;
  const vus = vusQuiz();
  const pool = poolQuiz(quizCat);
  const nouvelles = melanger(pool.filter(q => vus.indexOf(q.id) === -1));
  const anciennes = melanger(pool.filter(q => vus.indexOf(q.id) !== -1));
  quizPartie = nouvelles.concat(anciennes).slice(0, QUIZ_PAR_PARTIE);
  quizIdx = 0; quizBonnes = 0;
  quizQuestion();
}
function quizQuestion() {
  const q = quizPartie[quizIdx];
  const z = $("quiz-zone"); z.innerHTML = "";
  const c = el("div", "quiz-carte");
  c.append(el("div", "quiz-prog", `Question ${quizIdx + 1} / ${quizPartie.length}`));
  c.append(el("div", "quiz-q", q.q));
  const ordre = melanger(q.r.map((txt, i) => ({ txt, bon: i === q.ok })));
  const lettres = ["A", "B", "C"];
  const liste = el("div", "reps");
  const fb = el("div", "quiz-fb"); fb.hidden = true;
  const suite = el("button", "gros", quizIdx + 1 < quizPartie.length ? "Question suivante" : "Voir mon score");
  suite.type = "button"; suite.hidden = true;
  suite.addEventListener("click", () => { arreterParole(); if (quizIdx + 1 < quizPartie.length) { quizIdx++; quizQuestion(); } else quizFin(); });
  const boutons = ordre.map((o, i) => {
    const b = el("button", "rep", `${lettres[i]}. ${o.txt}`); b.type = "button";
    b.addEventListener("click", () => {
      noterVue(q.id);
      boutons.forEach((x, k) => { x.disabled = true; if (ordre[k].bon) x.classList.add("bon"); });
      let msg;
      if (o.bon) { quizBonnes++; msg = `Bravo ${prenomOuChampion()} ! ${q.info}`; }
      else { b.classList.add("mauvais"); msg = `Presque ! La bonne réponse : ${q.r[q.ok]}. ${q.info}`; }
      fb.textContent = msg; fb.hidden = false; suite.hidden = false;
      parlerSiActif(msg);
    });
    liste.append(b); return b;
  });
  c.append(liste, fb, suite);
  const ecouter = el("button", "mini", "🔁 Réécouter la question"); ecouter.type = "button";
  ecouter.style.marginTop = "14px";
  const lireQuestion = () => parler(`${q.q} ${ordre.map((o, i) => `Réponse ${lettres[i]} : ${o.txt}.`).join(" ")}`);
  ecouter.addEventListener("click", lireQuestion);
  c.append(ecouter); z.append(c);
  window.scrollTo(0, 0);
  if (voixActive) lireQuestion();
}
function quizFin() {
  const z = $("quiz-zone"); z.innerHTML = "";
  const deja = quizPointsAujourdhui();
  const place = Math.max(0, QUIZ_POINTS_MAX_JOUR - deja);
  const gagnes = Math.min(quizBonnes, place);
  if (gagnes > 0) { ecrire("sb_quizpts_" + jour(), String(deja + gagnes)); gagnerPoints(gagnes); }
  const c = el("div", "quiz-carte");
  c.append(el("div", "score", `${quizBonnes} / ${quizPartie.length}`));
  let phrase;
  if (quizBonnes === quizPartie.length) phrase = `Bravo ${prenomOuChampion()} ! Tu as tout bon !`;
  else if (quizBonnes >= 3) phrase = `Bien joué ${prenomOuChampion()} !`;
  else phrase = `Courage ${prenomOuChampion()}, on recommence et tu vas y arriver !`;
  c.append(el("div", "quiz-q", phrase));
  let pts;
  if (gagnes > 0) pts = `Tu gagnes ${gagnes} point${gagnes > 1 ? "s" : ""} ⭐`;
  else if (place === 0) pts = "Tu as déjà gagné tous tes points du quiz aujourd’hui. Reviens demain pour en gagner d’autres !";
  else pts = "Pas de point cette fois. Réessaie !";
  c.append(el("p", "", pts));
  const re = el("button", "gros", "Rejouer"); re.type = "button"; re.addEventListener("click", () => lancerQuiz(quizCat));
  const ac = el("button", "gros second", "Choisir un autre thème"); ac.type = "button"; ac.addEventListener("click", quizAccueil);
  c.append(re, ac); z.append(c);
  parlerSiActif(`${phrase} ${gagnes > 0 ? pts : ""}`);
}

/* ---------- Micro (navigateur) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function basculerMicro() {
  if (!SR) { zoneRep.textContent = TXT.pasMicro; delete zoneRep.dataset.rep; return; }
  if (enEcoute && rec) { rec.stop(); return; }
  arreterParole();
  rec = new SR();
  rec.lang = "fr-FR"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { enEcoute = true; btnMic.classList.add("ecoute"); btnMic.textContent = "🎤 J’écoute…"; };
  rec.onresult = ev => { champ.value = ev.results[0][0].transcript; };
  rec.onerror = () => { zoneRep.textContent = TXT.microErreur; delete zoneRep.dataset.rep; };
  rec.onend = () => { enEcoute = false; btnMic.classList.remove("ecoute"); btnMic.textContent = "🎤 Parler"; };
  rec.start();
}

/* ---------- Événements ---------- */
$("crayon").addEventListener("click", () => ouvrirProfil(false));
$("go").addEventListener("click", validerProfil);
$("fermer").addEventListener("click", fermerProfil);
$("prenom").addEventListener("keydown", e => { if (e.key === "Enter") validerProfil(); });
document.querySelectorAll("#ages button").forEach(b => b.addEventListener("click", () => { ageChoisi = b.dataset.age; majAges(); }));
$("retour").addEventListener("click", () => aller("accueil"));
$("quiz-retour").addEventListener("click", () => aller("accueil"));
$("voix").addEventListener("click", () => {
  voixActive = !voixActive; ecrire("sb_voix", voixActive ? "on" : "off");
  if (!voixActive) arreterParole();
  majEtatVoix();
});
$("reecouter").addEventListener("click", () => {
  if (dernierTexte) parler(dernierTexte); else toast("Pose d’abord une question à Super Brazza !");
});
document.querySelectorAll("nav button").forEach(b => {
  b.addEventListener("click", () => {
    const n = b.dataset.nav;
    aller(n === "chat" || n === "accueil" || n === "quiz" ? n : "bientot", n);
  });
});
btnEnv.addEventListener("click", demander);
btnMic.addEventListener("click", basculerMicro);
champ.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); demander(); }
});
// Certains téléphones n'autorisent la lecture qu'après un premier toucher
document.addEventListener("pointerdown", () => { if (vue === "accueil" && video.paused && $("voile").hidden) jouerVideo(); }, { once: true });

/* ---------- Démarrage ---------- */
try { profil = JSON.parse(lire("sb_profil") || "null"); } catch (e) { profil = null; }
points = Math.max(0, parseInt(lire("sb_pts") || "0", 10) || 0);
maillotActif = lire("sb_maillot") || "vert";
const mActif = MAILLOTS.find(m => m.id === maillotActif);
if (!mActif || !maillotDebloque(mActif)) maillotActif = "vert";
const r0 = lire("sb_reste_" + jour());
if (r0 !== null) restantes = Math.max(0, parseInt(r0, 10) || 0);

voixActive = lire("sb_voix") !== "off";
construireGrille(); afficherSalut(); afficherPoints(); afficherMaillots(); appliquerMaillot(); afficherCompteur();
zoneRep.textContent = TXT.accueilChat;
if (restantes <= 0) bloquer();
majEtatVoix();
jouerVideo();
if (!profil) ouvrirProfil(true);
</script>
